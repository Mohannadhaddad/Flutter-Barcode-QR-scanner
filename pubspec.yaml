name: qr_barcode_scanner
description: Professional QR and barcode scanner with history, generator, and configurable JSON server upload.
publish_to: 'none'
version: 1.0.7+8

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  mobile_scanner: ^7.0.0
  image_picker: ^1.1.2
  qr_flutter: ^4.1.0
  barcode_widget: ^2.0.4
  hive_ce: ^2.10.1
  hive_ce_flutter: ^2.2.0
  flutter_secure_storage: ^9.2.4
  http: ^1.2.2
  share_plus: ^10.1.4
  url_launcher: ^6.3.1
  gal: ^2.3.1
  provider: ^6.1.2
  google_fonts: ^6.2.1
  uuid: ^4.5.1
  package_info_plus: ^8.3.0
  path_provider: ^2.1.5
  permission_handler: ^11.4.0
  audioplayers: ^6.7.1
  vibration: ^3.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/app_icon.png
  adaptive_icon_background: "#0F8A6B"
  adaptive_icon_foreground: assets/branding/app_icon.png
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/beep.wav
    - assets/branding/app_icon.png
